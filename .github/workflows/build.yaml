on:
  push:
    branches:
      - "**"

name: Build
permissions:
  contents: read
  packages: write
env:
  REPO: ${{github.repository}}

jobs:
  build:
    name: Run checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make

  docker-build:
    runs-on: ubuntu-latest
    name: Build the docker image
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sanitize tag
        run: echo "TAG=${TAG//\//-}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: make image IMAGE=ghcr.io/${{env.REPO}}:${{env.TAG}}

      - name: Smoke-test image (Dataview + Pagefind, no network)
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          printf 'vault: /vault\nroot: Town\nsite: {title: T, base_url: "http://localhost/"}\n' > "$RUNNER_TEMP/work/publish.yaml"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/testdata/fixture-vault:/vault:ro" -v "$RUNNER_TEMP/work:/work" \
            ghcr.io/${{env.REPO}}:${{env.TAG}} build --strict
          test -f "$RUNNER_TEMP/work/site/issues/road-repair/index.html"
          test -d "$RUNNER_TEMP/work/site/pagefind"

      - name: Push
        run: docker push ghcr.io/${{env.REPO}}:${{env.TAG}}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go fmt ./...

      - name: Verify No Differences after format
        run: test -z "$(git diff)"
