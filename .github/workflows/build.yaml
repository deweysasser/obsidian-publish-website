on:
  push:
    branches:
      - "**"

name: Build
permissions:
  contents: read
  packages: write
env:
  REPO: ${{github.repository}}

jobs:
  build:
    name: Run checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      # Builds and tests the TypeScript in a container, and fails if the
      # committed browser assets don't match their sources.
      - name: Browser scripts
        run: make web-check

      - name: Test
        run: make test

      - name: Build
        run: make

  docker-build:
    runs-on: ubuntu-latest
    name: Build the docker image
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sanitize tag
        run: echo "TAG=${TAG//\//-}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: make image IMAGE=ghcr.io/${{env.REPO}}:${{env.TAG}}

      - name: Smoke-test image (Dataview + Pagefind, no network)
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          printf 'vault: /vault\nroot: Town\nsite: {title: T, base_url: "http://localhost/"}\n' > "$RUNNER_TEMP/work/publish.yaml"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/testdata/fixture-vault:/vault:ro" -v "$RUNNER_TEMP/work:/work" \
            ghcr.io/${{env.REPO}}:${{env.TAG}} build --strict --output-format jsonl | tee "$RUNNER_TEMP/build.log"
          test -f "$RUNNER_TEMP/work/site/issues/road-repair/index.html"
          test -d "$RUNNER_TEMP/work/site/pagefind"
          # Search indexed through the Node API in stable order, not the CLI fallback.
          grep -q '"stable_order":true' "$RUNNER_TEMP/build.log"
          # The Go program's HTTPS (R2, purge API, YouTube) needs the system CA bundle.
          docker run --rm --entrypoint test ghcr.io/${{env.REPO}}:${{env.TAG}} -s /etc/ssl/certs/ca-certificates.crt

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The real-Pagefind search tests, against the image's own node and
      # pagefind. TestRunPagefindStableChunks fails if a Pagefind upgrade
      # stops numbering pages in the order they're added.
      - name: Search tests in the image
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/search.test" ./internal/search
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP/search.test:/search.test:ro" --entrypoint /search.test \
            ghcr.io/${{env.REPO}}:${{env.TAG}} -test.v -test.run 'TestRunPagefind'

      - name: Push
        run: docker push ghcr.io/${{env.REPO}}:${{env.TAG}}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go fmt ./...

      - name: Verify No Differences after format
        run: test -z "$(git diff)"
